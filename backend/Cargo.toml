[package]
name = "tui-patcher-agent"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
description = "AI-powered Android patching service"
repository = "https://github.com/tui-patcher/tui-patcher-agent"

[dependencies]
# Core Web Framework
axum = { version = "0.7", features = ["macros", "ws"] }
tokio = { version = "1.46.1", features = ["full"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "request-id", "timeout"] }

# OpenTelemetry Stack (Q3 2025 Sprint)
opentelemetry = { version = "0.30" }
opentelemetry-otlp = { version = "0.30", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.31"
opentelemetry-semantic-conventions = "0.30"
axum-otel = "0.30.8"

# Tracing & Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"] }

# HTTP Client & Async
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
hyper = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# UUID & Time
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Slack Notifications (Q3 2025 Sprint)
webhook = "2.1"
slack-hook = "0.9"

# Circuit Breaker Pattern
circuitbreaker-rs = "0.1.1"

# SBOM Generation (Q3 2025 Sprint)
cyclonedx-bom = "0.8"

# Perplexity AI Integration (Dual-key)
perplexity = "0.1.1"

# Machine Learning (Future Q4 2025)
tflite = { version = "0.9.8", optional = true }

# WASM Runtime (Future H1 2026)
wasmtime = { version = "35.0.0", optional = true }

# Error Handling
anyhow = "1.0"
thiserror = "1.0"

# Async Runtime
futures = "0.3"

[dev-dependencies]
tower-test = "0.4"

[features]
default = ["otel-integration"]
otel-integration = []
tflite-ai = ["tflite"]
wasm-plugins = ["wasmtime"]
edge-runtime = []

[[bin]]
name = "tui-patcher-agent"
path = "src/main.rs"

