version: "3.9"
services:
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: smartfix/worker:latest
    volumes:
      - ./tasks/chunks:/app:ro
    entrypoint: ["/usr/local/bin/run_task.sh"]
    command: ["tasks.txt"]
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 3
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"
    healthcheck:
      test: ["CMD-SHELL", "pgrep worker || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
